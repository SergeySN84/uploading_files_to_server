name: Deploy to Production

on:
  push:
    branches:
      - "feature/diplom"
      - "develop"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pipx install poetry

      - name: Install dependencies
        run: |
          poetry install --no-root

      - name: Run Black (code formatting check)
        run: |
          poetry run black . --check --diff

      - name: Run Flake8 (PEP8 compliance)
        run: |
          poetry run flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pipx install poetry

      - name: Install dependencies
        run: |
          poetry install --no-root

      - name: Run backend tests
        run: |
          poetry run pytest users/tests.py -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry-run or local build)
        run: |
          docker-compose config
          echo "✅ Docker Compose configuration is valid"
          # Опционально: можно собрать образ локально для проверки
          # docker-compose build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add SSH key for deployment
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to remote server
        run: |
          ssh -o StrictHostKeyChecking=no test@84.252.141.96 '
            cd /home/test/uploading-files-to-server &&
            git pull origin main &&
            docker-compose down &&
            docker-compose up --build -d &&
            docker-compose exec -T web python manage.py migrate
          '